services:
  - type: web
    name: church-website-mern
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: SEED_DATA
        value: "false"
      - key: CLIENT_URL
        # Set this to your Cloudflare Pages URL e.g. https://your-project.pages.dev
        sync: false
      - key: EMAIL_USER
        value: kallettumkarachurch@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: GMAIL_WEBHOOK_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false



